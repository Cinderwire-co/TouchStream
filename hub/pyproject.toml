[project]
name = "touchstream-hub"
version = "0.1.0"
description = "TouchStream hub: pair spokes, go live everywhere, keep every recording"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "tzdata",           # time zones for recurring broadcasts (Windows has none built in)
    "mcp>=2.3,<3",      # the MCP endpoint, for AI agents (mcp_server.py)
]

[project.optional-dependencies]
# Speech-to-text transcripts on the hub (Whisper)
transcribe = ["faster-whisper>=1.1"]

[project.scripts]
touchstream-hub = "touchstream_hub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["touchstream_hub"]
